name: Verify application
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/backend/requirements.txt
      - run: pip install -r services/backend/requirements.txt
      - run: python -m pytest services/backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start a synthetic demo instance
        run: APP_MODE=demo docker compose up --build -d --wait --wait-timeout 180
      - name: Check public API through web proxy
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/api/v1/status
          curl --fail http://localhost:3000/api/v1/dashboard
          curl --fail http://localhost:3000/
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop CI instance
        if: always()
        run: docker compose down -v
