name: developer-trends

x-backend: &backend
  build:
    context: ./services/backend
  restart: unless-stopped
  init: true
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://trends:trends_local@db:5432/trends}
    APP_MODE: ${APP_MODE:-live}
    STACKEXCHANGE_SITE: ${STACKEXCHANGE_SITE:-stackoverflow}
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - model-cache:/home/app/.cache

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trends}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trends_local}
      POSTGRES_DB: ${POSTGRES_DB:-trends}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend
    command: [python, -m, app.worker]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    init: true
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NODE_ENV: production
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  model-cache:
