# Optional file-mounted credentials. See README before using this override.
# docker compose -f compose.yaml -f compose.secrets.yaml up --build -d
services:
  db:
    environment:
      POSTGRES_PASSWORD: ''
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
  api:
    environment:
      DATABASE_URL: ''
      DATABASE_URL_FILE: /run/secrets/database_url
      STACKEXCHANGE_API_KEY: ''
      STACKEXCHANGE_API_KEY_FILE: /run/secrets/stackexchange_api_key
    secrets:
      - database_url
      - stackexchange_api_key
  worker:
    environment:
      DATABASE_URL: ''
      DATABASE_URL_FILE: /run/secrets/database_url
      STACKEXCHANGE_API_KEY: ''
      STACKEXCHANGE_API_KEY_FILE: /run/secrets/stackexchange_api_key
    secrets:
      - database_url
      - stackexchange_api_key
secrets:
  database_password:
    file: ./secrets/database_password.txt
  database_url:
    file: ./secrets/database_url.txt
  stackexchange_api_key:
    file: ./secrets/stackexchange_api_key.txt
